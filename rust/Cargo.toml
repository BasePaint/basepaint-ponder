[package]
name = "basepaint-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-graphql = { version = "7", features = ["dynamic-schema"] }
axum = "0.8"
base64 = "0.23.1"
ethnum = "1.5.3"
futures = "0.3.34"
hex = "0.4.3"
memmap2 = "0.9.12"
parking_lot = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "system-proxy"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
