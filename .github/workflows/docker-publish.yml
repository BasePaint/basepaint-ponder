name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "latest=ghcr.io/$owner/${{ github.event.repository.name }}:latest" >> "$GITHUB_ENV"
          echo "sha=ghcr.io/$owner/${{ github.event.repository.name }}:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "cache=ghcr.io/$owner/${{ github.event.repository.name }}:buildcache" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.latest }}
            ${{ env.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.cache }}
          cache-to: type=registry,ref=${{ env.cache }},mode=max

      - name: Read commit subject
        id: source
        run: |
          subject=$(git log -1 --pretty=%s "$GITHUB_SHA" | tr '\r\n' ' ')
          printf 'subject=%s\n' "$subject" >> "$GITHUB_OUTPUT"

      - name: Promote image to Kubernetes
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.BASEPAINT_INFRA_PROMOTER_TOKEN }}
          SOURCE_SUBJECT: ${{ steps.source.outputs.subject }}
        run: |
          gh api repos/BasePaint/basepaint-infra/dispatches \
            --method POST \
            -f event_type=promote-image \
            -f client_payload[service]=basepaint-ponder \
            -f client_payload[source_sha]="${{ github.sha }}" \
            -f client_payload[source_subject]="$SOURCE_SUBJECT"
