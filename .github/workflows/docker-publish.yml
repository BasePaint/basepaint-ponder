name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "latest=ghcr.io/$owner/${{ github.event.repository.name }}:latest" >> "$GITHUB_ENV"
          echo "sha=ghcr.io/$owner/${{ github.event.repository.name }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg GIT_SHA="${{ github.sha }}" \
            -t "${{ env.latest }}" \
            -t "${{ env.sha }}" .

      - name: Push Docker image
        run: |
          docker push "${{ env.latest }}"
          docker push "${{ env.sha }}"
